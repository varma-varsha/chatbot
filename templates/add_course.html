{% extends "admin_base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-8">Add New Course</h1>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form id="addCourseForm" class="space-y-6">
            <!-- Course Details -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Language/Course Name</label>
                    <input type="text" name="language" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                        placeholder="e.g. Python">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea name="description" required rows="3"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                        placeholder="Course description..."></textarea>
                </div>
            </div>

            <!-- Chapters Section -->
            <div class="border-t border-gray-200 pt-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-medium text-gray-900">Chapters</h3>
                    <button type="button" onclick="addChapter()"
                        class="px-3 py-1.5 border border-transparent text-sm font-medium rounded-md text-blue-700 bg-blue-100 hover:bg-blue-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        + Add Chapter
                    </button>
                </div>

                <div id="chapters-container" class="space-y-4">
                    <!-- Dynamic chapters will be added here -->
                </div>
            </div>

            <div class="pt-6 border-t border-gray-200 flex justify-end">
                <button type="submit"
                    class="px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Create Course
                </button>
            </div>
        </form>
    </div>
</div>

<template id="chapter-template">
    <div class="chapter-card bg-gray-50 rounded-lg p-4 border border-gray-200 relative">
        <button type="button" onclick="removeChapter(this)"
            class="absolute top-2 right-2 text-gray-400 hover:text-red-500">
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd" />
            </svg>
        </button>
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-gray-700 uppercase">Chapter Title</label>
                <input type="text" name="chapter_title[]" required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 uppercase">Description</label>
                <textarea name="chapter_description[]" rows="2"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"></textarea>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 uppercase">Sample Code</label>
                <textarea name="chapter_code[]" rows="3"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border font-mono text-xs"></textarea>
            </div>
        </div>
    </div>
</template>

<script>
    function addChapter() {
        const container = document.getElementById('chapters-container');
        const template = document.getElementById('chapter-template');
        const clone = template.content.cloneNode(true);
        container.appendChild(clone);
    }

    function removeChapter(btn) {
        btn.closest('.chapter-card').remove();
    }

    document.getElementById('addCourseForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        const chapters = [];

        // Collect chapter data
        const titles = formData.getAll('chapter_title[]');
        const descriptions = formData.getAll('chapter_description[]');
        const codes = formData.getAll('chapter_code[]');

        titles.forEach((title, index) => {
            chapters.push({
                title: title,
                description: descriptions[index],
                sampleCode: codes[index]
            });
        });

        const courseData = {
            language: formData.get('language'),
            description: formData.get('description'),
            chapters: chapters
        };

        try {
            // Get CSRF token from meta tag
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

            const response = await fetch('{{ url_for("add_course") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(courseData)
            });

            const result = await response.json();

            if (result.success) {
                alert('Course created successfully!');
                window.location.href = '{{ url_for("admin_dashboard") }}';
            } else {
                alert('Error creating course: ' + (result.error || 'Unknown error'));
            }
        } catch (error) {
            alert('Network error: ' + error.message);
        }
    });

    // Add initial chapter
    addChapter();
</script>
{% endblock %}
